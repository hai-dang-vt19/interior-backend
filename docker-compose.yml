services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interior_app
    restart: unless-stopped
    working_dir: /var/www
    command: >
      sh -c "mkdir -p storage/framework/views storage/framework/cache storage/framework/sessions bootstrap/cache
      && chown -R www-data:www-data storage bootstrap/cache
      && chmod -R ug+rwx storage bootstrap/cache
      && php-fpm"
    volumes:
      - ./:/var/www:cached
      - vendor_data:/var/www/vendor
    depends_on:
      - db
    networks:
      - interior_network

  nginx:
    image: nginx:alpine
    container_name: interior_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./storage/app/public:/var/www/storage/app/public:ro
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - interior_network

  db:
    image: mysql:8.0
    container_name: interior_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: interior_db
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: interior
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - interior_network

networks:
  interior_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  vendor_data:
    driver: local
